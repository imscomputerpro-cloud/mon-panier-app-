<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scan Panier</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
    .camera-container { position: relative; flex: 1; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .panel { background: #1E1E1E; padding: 15px; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; }
    .detected-price { font-size: 28px; font-weight: bold; color: #00E676; text-align: center; min-height: 38px; }
    
    .btn { padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 100%; }
    .btn-scan { background: #00B0FF; color: white; }
    .btn-add { background: #00E676; color: black; }
    .btn-add:disabled { background: #333; color: #666; }
    
    .total-container { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="panel">
    <div id="status" style="text-align: center; color: #aaa; font-size: 13px;">CADREZ UN PRIX ET APPUYEZ SUR DÉTECTER</div>
    <div id="detected-price" class="detected-price">-- €</div>

    <button id="btn-scan" class="btn btn-scan" onclick="capturerEtLire()">📷 DÉTECTER LE PRIX</button>
    <button id="btn-add" class="btn btn-add" disabled onclick="ajouterAuPanier()">Ajouter au panier</button>

    <div class="total-container">
      <span>Total Panier :</span>
      <span id="total-price" style="color:#00B0FF;">0.00 €</span>
    </div>
    
    <button onclick="raz()" style="background:transparent; color:#FF5252; border:none; padding:5px;">Réinitialiser</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const detectedPriceText = document.getElementById('detected-price');
    const statusText = document.getElementById('status');
    const btnAdd = document.getElementById('btn-add');
    const btnScan = document.getElementById('btn-scan');
    
    let prixActuel = null;
    let total = 0.0;

    // Démarrer le flux vidéo
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(stream => { video.srcObject = stream; })
      .catch(err => { statusText.innerText = "Erreur d'accès caméra"; });

    async function capturerEtLire() {
      btnScan.innerText = "⏳ Analyse en cours...";
      btnScan.disabled = true;
      statusText.innerText = "Analyse de l'image...";

      // Capture de l'image vidéo dans le canvas
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      try {
        // Traitement OCR
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(canvas);
        await worker.terminate();

        const prix = extrairePrix(ret.data.text);

        if (prix !== null) {
          prixActuel = prix;
          detectedPriceText.innerText = prix.toFixed(2) + " €";
          btnAdd.disabled = false;
          statusText.innerText = "Prix détecté avec succès !";
        } else {
          detectedPriceText.innerText = "Non détecté";
          statusText.innerText = "Assurez-vous que le prix (ex: 2.50) est bien visible";
          btnAdd.disabled = true;
        }
      } catch(e) {
        statusText.innerText = "Erreur lors de la lecture";
      }

      btnScan.innerText = "📷 DÉTECTER LE PRIX";
      btnScan.disabled = false;
    }

    function extrairePrix(texte) {
      // Détecte les nombres avec virgule ou point (ex: 12.99, 4,50, 3€)
      const regex = /(\d+[\.,]\d{1,2})/g;
      const matches = texte.match(regex);
      if (matches && matches.length > 0) {
        let val = parseFloat(matches[0].replace(',', '.'));
        if (!isNaN(val) && val > 0 && val < 1000) return val;
      }
      return null;
    }

    function ajouterAuPanier() {
      if (prixActuel !== null) {
        total += prixActuel;
        document.getElementById('total-price').innerText = total.toFixed(2) + " €";
        prixActuel = null;
        btnAdd.disabled = true;
        detectedPriceText.innerText = "-- €";
        statusText.innerText = "Ajouté ! Pointez le produit suivant.";
      }
    }

    function raz() {
      total = 0.0;
      document.getElementById('total-price').innerText = "0.00 €";
      statusText.innerText = "Panier réinitialisé";
    }
  </script>
</body>
</html>
